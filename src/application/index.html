<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>FlightGPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <script type="module" src="https://js.arcgis.com/calcite-components/3.2.1/calcite.esm.js"></script>
  <link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/dark/main.css" />
  <link rel="stylesheet" href="style.css">
  <script src="https://js.arcgis.com/4.33/"></script>
  <script defer type="module" src="https://js.arcgis.com/4.33/map-components/"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <div class="layout">
    <div class="map-wrapper">

      <div class="arcgismap">
        <div class="map-wrapper">
          <div id="map" class="arcgismap"></div>
        </div>


        <aside class="account-panel glass fade-in-down" aria-label="Account Panel">
          <div class="account-card">
            <div class="account-actions">
              <button class="account-icon-slot" style="margin-left:-10px;"id="settingsBtn" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sliders" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M11.5 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M9.05 3a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0V3zM4.5 7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2.05 8a2.5 2.5 0 0 1 4.9 0H16v1H6.95a2.5 2.5 0 0 1-4.9 0H0V8zm9.45 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m-2.45 1a2.5 2.5 0 0 1 4.9 0H16v1h-2.05a2.5 2.5 0 0 1-4.9 0H0v-1z"/>
                </svg>
              </button>
              <button class="account-icon-slot" id="dataBtn" aria-label="Data">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-table" viewBox="0 0 16 16">
                  <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm15 2h-4v3h4zm0 4h-4v3h4zm0 4h-4v3h3a1 1 0 0 0 1-1zm-5 3v-3H6v3zm-5 0v-3H1v2a1 1 0 0 0 1 1zm-4-4h4V8H1zm0-4h4V4H1zm5-3v3h4V4zm4 4H6v3h4z"/>
                </svg>
              </button>
            </div>
          </div>
        </aside>

        <aside class="overlay-panel glass slide-in-left">
          <div class="chat-boundary">

            <div class="chat-header">
              <div class="chat-header-left">
                <img src="flightbot-logo-text.png" style="height: 60px; width: auto;"alt="FlightGPT Logo" class="chat-logo"/>
              </div>
              <div class="chat-header-right">
              </div>
            </div>

            <div class="chat-history">            
                <div class="chat-alerts-wrapper">
                  <div class="filter-buttons">
                    <button class="filter-btn filter-btn-airports" data-filter="ap">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-geo" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 1a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 4a4 4 0 1 1 4.5 3.969V13.5a.5.5 0 0 1-1 0V7.97A4 4 0 0 1 4 3.999zm2.493 8.574a.5.5 0 0 1-.411.575c-.712.118-1.28.295-1.655.493a1.3 1.3 0 0 0-.37.265.3.3 0 0 0-.057.09V14l.002.008.016.033a.6.6 0 0 0 .145.15c.165.13.435.27.813.395.751.25 1.82.414 3.024.414s2.273-.163 3.024-.414c.378-.126.648-.265.813-.395a.6.6 0 0 0 .146-.15l.015-.033L12 14v-.004a.3.3 0 0 0-.057-.09 1.3 1.3 0 0 0-.37-.264c-.376-.198-.943-.375-1.655-.493a.5.5 0 1 1 .164-.986c.77.127 1.452.328 1.957.594C12.5 13 13 13.4 13 14c0 .426-.26.752-.544.977-.29.228-.68.413-1.116.558-.878.293-2.059.465-3.34.465s-2.462-.172-3.34-.465c-.436-.145-.826-.33-1.116-.558C3.26 14.752 3 14.426 3 14c0-.599.5-1 .961-1.243.505-.266 1.187-.467 1.957-.594a.5.5 0 0 1 .575.411"/>
                      </svg>
                      Airports
                    </button>
                    <button class="filter-btn filter-btn-trajectories" data-filter="tj">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-compass" viewBox="0 0 16 16">
                        <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016m6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
                        <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
                      </svg>
                      Trajectories
                    </button>
                    <button class="filter-btn filter-btn-other" data-filter="ot">
                      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="3"/>
                      </svg>
                      Other
                    </button>
                </div>
              </div>
            </div>

            <div id="layerSwitcher" class="layer-switcher glass is-hidden" aria-label="Layer-Auswahl" style="margin:10px 0;">
              <div class="layer-switcher-list" id="layerSwitcherList"></div>
            </div>

            <div class="chat-input-boundary">
              <div class="chat-input">
                <div id="chatLoading" class="loading-indicator" hidden>
                  <div class="spinner" aria-hidden="true"></div>
                </div>
                <textarea id="chatInput" class="chat-input-field" rows="1" placeholder="Type in your question.."></textarea>
                <button id="sendBtn" type="button" class="icon-button" title="Senden" aria-label="Submit">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
                    <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/>
                  </svg>
                </button>
              </div>
              <div class="reasoning-toggle-wrapper">
                <label class="reasoning-toggle">
                  <input type="checkbox" id="reasoningToggle" class="reasoning-toggle-input">
                  <span class="reasoning-toggle-slider"></span>
                </label>
                <span class="reasoning-toggle-label" id="reasoningLabel">Reasoning</span>
              </div>
              
              <div class="chat-input-extras"></div>
            </div>
              <div class="chat-input-extras">
              </div>
            </div>
          </div>
        </aside>

        <aside id="dataPanel" class="data-panel glass fade-in-down is-hidden" aria-label="Tabular Data">
        <div class="data-boundary">
          <div class="data-header">
            <div class="data-header-left">
              <p class="data-header-title">Data Tab</p>
            </div>
            <div class="data-header-right">
              <button id="dataPanelClose"
                      type="button"
                      class="data-header-close"
                      title="Close"
                      aria-label="Close data panel">
                ✕
              </button>
            </div>
          </div>

          <div class="data-body">
            <div id="dataPanelTableWrapper" class="data-table-wrapper">
            </div>
          </div>
        </div>
      </aside>

      </div>
    </div>
  </div>
</body>
</html>
